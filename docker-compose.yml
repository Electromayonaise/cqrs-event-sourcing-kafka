# Infraestructura completa: Kafka + Zookeeper, MongoDB (event store), MySQL (read DB)
# y los dos microservicios (Command API :5000, Query API :5001).
# Uso:  docker compose up -d --build
name: techbank

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on: [zookeeper]
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Crea el topic unico BankAccountEvents (1 particion => orden total de los eventos)
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["kafka-topics", "--bootstrap-server", "kafka:9092", "--create", "--if-not-exists",
                 "--topic", "BankAccountEvents", "--partitions", "1", "--replication-factor", "1"]

  mongo:
    image: mongo:4.4
    container_name: mongo
    ports:
      - "27017:27017"

  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: techbankRootPsw
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ptechbankRootPsw"]
      interval: 10s
      timeout: 5s
      retries: 12

  account-cmd:
    build:
      context: .
      target: cmd
    image: techbank/account-cmd
    container_name: account-cmd
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_started
    ports:
      - "5000:5000"
    environment:
      SPRING_DATA_MONGODB_HOST: mongo
      SPRING_KAFKA_PRODUCER_BOOTSTRAPSERVERS: kafka:9092

  account-query:
    build:
      context: .
      target: query
    image: techbank/account-query
    container_name: account-query
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    ports:
      - "5001:5001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bankAccount?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_KAFKA_CONSUMER_BOOTSTRAPSERVERS: kafka:9092
      SPRING_JPA_SHOWSQL: "false"
